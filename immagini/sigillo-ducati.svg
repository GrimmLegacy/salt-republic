<svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="0 0 72 72">
  <!-- Sigillo della Zecca: la moneta dei ducati, accanto al numero.

     Il bordo dentellato e' un trucco, non un disegno: un cerchio con
     `stroke-dasharray` e' gia' il coltellino che incide il bordo delle monete
     vere. Con un tracciato tratteggiato si ottengono quarantacinque denti puliti
     invece di quarantacinque path scritti a mano che non si incontrano mai.

     Il leone alato di San Marco e' nel campo: e' il simbolo della Serenissima,
     quindi e' quello giusto per i ducati. Serve un'immagine e non un gradiente
     CSS perche' il leone e' una figura: fatto di gradienti viene un tondo
     anonimo. -->
  <defs>
    <radialGradient id="field" cx="34%" cy="26%" r="80%">
      <stop offset="0" stop-color="#4c3a1b"/>
      <stop offset="0.55" stop-color="#251a0e"/>
      <stop offset="1" stop-color="#110b05"/>
    </radialGradient>
  </defs>

  <!-- il corpo della moneta -->
  <circle cx="36" cy="36" r="35" fill="#5f4719"/>

  <!-- il coltellino sul bordo, chiaro sopra e scuro sotto per lo spessore -->
  <circle cx="36" cy="36" r="32" fill="none" stroke="#e2c078" stroke-width="6" stroke-dasharray="2.2 2.8"/>
  <circle cx="36" cy="36" r="32" fill="none" stroke="#2e2210" stroke-width="6" stroke-dasharray="0.9 4.1" opacity="0.45"/>

  <!-- il campo incuso e i due cerchi che lo chiudono -->
  <circle cx="36" cy="36" r="28" fill="url(#field)"/>
  <circle cx="36" cy="36" r="28" fill="none" stroke="#c99a33" stroke-width="1.4"/>
  <circle cx="36" cy="36" r="23" fill="none" stroke="#a8802b" stroke-width="0.8" opacity="0.5"/>

  <!-- le due ali, una per lato, con le penne -->
  <g fill="#d8ae5c" stroke="#8a6a24" stroke-width="0.7" stroke-linejoin="round">
    <path d="M38 30 C 44 21, 54 18, 59 24 C 54 26, 50 30, 47 35 C 44 38, 39 37, 38 33 Z"/>
    <path d="M34 30 C 28 21, 18 18, 13 24 C 18 26, 22 30, 25 35 C 28 38, 33 37, 34 33 Z"/>
  </g>
  <g stroke="#8a6a24" stroke-width="0.7" opacity="0.8">
    <path d="M47 26 L54 23"/><path d="M46 29 L53 27"/><path d="M44.5 32 L51 31"/>
    <path d="M25 26 L18 23"/><path d="M26 29 L19 27"/><path d="M27.5 32 L21 31"/>
  </g>

  <!-- la testa e il muso del leone -->
  <circle cx="36" cy="32" r="6.2" fill="#e6c079" stroke="#8a6a24" stroke-width="0.8"/>
  <path d="M36 35.5 C 32.8 35.5, 31.6 38, 32.6 40.4 C 33.6 42.4, 38.4 42.4, 39.4 40.4 C 40.4 38, 39.2 35.5, 36 35.5 Z" fill="#f0dcae" stroke="#8a6a24" stroke-width="0.6"/>
  <circle cx="33.7" cy="31.2" r="0.9" fill="#3a2a10"/>
  <circle cx="38.3" cy="31.2" r="0.9" fill="#3a2a10"/>
  <path d="M36 38.4 L34.8 40.2 H37.2 Z" fill="#3a2a10"/>

  <!-- il libro aperto sotto le zampe -->
  <path d="M23 45.5 C 27.5 42, 32 42.5, 36 45.5 C 40 42.5, 44.5 42, 49 45.5 L49 53.5 C 44.5 50, 40 50.5, 36 53.5 C 32 50.5, 27.5 50, 23 53.5 Z"
        fill="#d9bd80" stroke="#8a6a24" stroke-width="0.9" stroke-linejoin="round"/>
  <path d="M36 45.5 V53.5" stroke="#8a6a24" stroke-width="0.9"/>
</svg>